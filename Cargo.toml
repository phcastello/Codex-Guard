[package]
name = "codex-guard"
version = "0.1.0"
edition = "2021"
description = "Quota-aware supervisor for Codex App Server"
license = "MIT"

[[bin]]
name = "codex-guard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
humantime = "2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }
